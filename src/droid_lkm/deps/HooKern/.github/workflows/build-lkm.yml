name: Build All GKI
on:
  push:
    paths:
      - 'lib/**'
      - 'src/**'
      - 'Makefile'
      - 'deps.lst'
      - '.sdk-version'
      - '.github/workflows/build-lkm.yml'
  workflow_dispatch:

jobs:
  build-matrix:
    strategy:
      matrix:
        kmi:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-20260313
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Fetch deps
        run: |
          ./scripts/fetch-deps.sh
      - name: Build default
        run: make
      - name: Build LSM
        run: make HK_LSM=1 VER=lsm
      - uses: actions/upload-artifact@v4
        with:
          name: lkmhook-${{ matrix.kmi }}
          path: |
            out/lkmhook.ko
            out/lsm/lkmhook.ko
